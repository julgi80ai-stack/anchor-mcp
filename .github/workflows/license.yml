# SPDX-License-Identifier: Apache-2.0
# 라이선스 게이트 (SPEC §12.2, THIRD-PARTY.md §5). 사람의 기억으로 막을 수
# 없는 것을 CI가 막는다 — 카피레프트 유입, trafilatura 하한.
name: license-audit
on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pip-licenses packaging
      - name: 전체 트리 라이선스 목록 (기록용)
        run: pip-licenses --format=csv --with-urls
      - name: 카피레프트 차단 + trafilatura 하한 (선택형 OR 라이선스는 선택 가능 여부로 판정)
        run: python tools/audit_licenses.py --all-installed --fail-on-copyleft --check-floors
