# SPDX-License-Identifier: Apache-2.0
# CI 매트릭스 (SPEC §10 이식성: Linux / macOS / Windows, Python 3.11+)
#
# **푸시할 때 돌지 않는다** (2026-08-20). 이 저장소는 비공개라 Actions가 분으로
# 과금되고 배수가 붙는다(Linux ×1 · Windows ×2 · macOS ×10). 실측: 이 매트릭스
# 1회 = 약 154 과금 분(macOS가 72%), 실제 소요는 6분.
#
# 리눅스 검사는 **개발 기계에서 이미 매번 돈다** — `pytest -q` 전량 + 벤치마크
# 게이트. GitHub이 필요한 것은 여기서 **물리적으로 불가능한 것**뿐이다:
# Windows(개발 기계는 WSL2 = 리눅스 커널), macOS, 그리고 로컬에 없는 파이썬
# 버전. 그것을 매 푸시마다 살 이유는 없다.
#
# 그래서 방아쇠를 **필요할 때**로 옮긴다 — 릴리스 태그와 수동뿐이다.
# 주간 스케줄도 두지 않는다: 이 매트릭스는 코드가 한 줄도 안 바뀐 주에도 돌아
# 월 665분(무료 한도 2,000분의 33%)을 태운다. 놀고 있는 주에 태울 이유가 없고,
# 정말 필요하면 `gh workflow run test` 한 줄이면 된다.
# `benchmark.yml`이 이미 같은 방식이었다(주 1회 + 수동); 이 파일에만 절제가
# 없었다. 이식성 커버리지는 그대로다(3 OS × Python 3종 유지).
#
# 수동 실행:  gh workflow run test
name: test
on:
  workflow_dispatch:
  push:
    tags: ["v*"]          # 릴리스 직전에는 반드시 3 OS를 본다

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
