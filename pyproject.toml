[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anchor-mcp"
version = "1.16.0"
description = "AI가 사용한 웹 근거의 시간적·출처적 무결성 계층 — Memento(RFC 7089)의 로컬 클라이언트"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# 기본 glob(LICEN[CS]E*·NOTICE*·COPYING*·AUTHORS*)은 THIRD-PARTY.md를 안 잡는다.
# 그래서 sdist에는 실리고 **휠에는 빠져** 있었다 — 카피레프트 감사 결과를
# 배포물이 달고 가지 않으면 그 규율이 저장소 안에만 남는다 (2026-08-20).
# 명시하면 기본 glob을 덮으므로 셋을 전부 적는다.
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY.md"]
authors = [{ name = "Julgi.Kang" }]
dependencies = [
    # 라이선스 하한은 1.8.0 — 미만은 GPLv3+이며 Apache-2.0 배포와 충돌한다. 낮추지 말 것.
    # 기능 하한은 1.9.0 — markdown 출력(output_format="markdown")이 이 버전에서 추가됐다.
    "trafilatura>=1.9.0",
    "readability-lxml",  # 본문 추출 폴백 (SPEC §5.3)
    "lxml",
    "markdownify",  # readability 폴백 경로의 마크다운 변환
    "httpx",
    "protego",
    "charset-normalizer",
    "blake3",
    "zstandard",
    "typer",
    # 근사 매칭 주 구현 (SPEC §6.2). Apache-2.0 AND CNRI-Python — THIRD-PARTY.md §4.2.
    "regex",
    "mcp",
    "pypdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "packaging",
    # 속성 테스트 (SPEC §12). MPL-2.0 — dev 전용, 배포물 미포함 (THIRD-PARTY §2.1)
    "hypothesis",
    "pytest-cov",
]

[project.scripts]
anchor = "anchor.cli:app"
anchor-mcp = "anchor.server:main"

[tool.hatch.build.targets.sdist]
# .gitignore에 넣는 것만으로 충분하지만, 여기서 한 번 더 막는다 —
# 배포물은 되돌릴 수 없고(PyPI 재업로드 불가), 무시 규칙 하나가 지워지면
# 그대로 새어 나간다. 이 두 줄이 두 번째 자물쇠다.
exclude = [".hypothesis", ".pytest_cache", "**/__pycache__", "*.db", ".coverage"]

[tool.hatch.build.targets.wheel]
packages = ["src/anchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
